                grid.innerHTML += `
                    <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm hover:shadow-md transition flex items-center justify-between gap-3">
                        <div class="w-20 h-20 bg-slate-50 rounded-xl overflow-hidden flex-shrink-0 border border-slate-100 flex items-center justify-center">
                            ${imgHTML}
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-800 text-sm">${item.name}</h3>
                            <p class="text-[11px] text-amber-600 font-semibold mt-0.5"><i class="fa-solid fa-fire-flame-curved text-[9px]"></i> ${item.cal} سعرة حرارية</p>
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-brandGreen font-black text-sm">${item.price} <span class="text-[10px]">ر.س</span></span>
                                <button onclick="addToCart('${item.name}', ${item.price})" class="bg-brandGreen text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-brandDarkGreen transition">
                                    + إضافة
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active-tab'));
            btn.classList.add('active-tab');
            renderMenu();
        }

        function addToCart(name, price) {
            const index = cart.findIndex(i => i.name === name);
            if(index > -1) { cart[index].qty += 1; } 
            else { cart.push({ name, price, qty: 1 }); }
            updateCartUI();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            document.getElementById('cartCount').innerText = totalItems;
            document.getElementById('cartTotal').innerText = totalPrice;

            const cartBar = document.getElementById('cartBar');
            if (totalItems > 0) { cartBar.classList.remove('hidden'); } 
            else { cartBar.classList.add('hidden'); closeCartModal(); }
        }

        function openCartModal() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            cart.forEach((item, idx) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-100 p-3 rounded-xl">
                        <div>
                            <p class="font-bold text-sm text-slate-800">${item.name}</p>
                            <p class="text-xs text-brandGreen font-bold">${item.price * item.qty} ر.س</p>
                        </div>
                        <div class="flex items-center gap-2 bg-white px-2 py-1 rounded-lg border border-slate-200">
                            <button onclick="changeQty(${idx}, -1)" class="text-red-600 font-bold px-1.5 text-base">-</button>
                            <span class="font-bold text-xs px-1">${item.qty}</span>
                            <button onclick="changeQty(${idx}, 1)" class="text-green-600 font-bold px-1.5 text-base">+</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        function changeQty(idx, delta) {
            cart[idx].qty += delta;
            if(cart[idx].qty <= 0) cart.splice(idx, 1);
            updateCartUI();
            if(cart.length > 0) openCartModal();
        }

        function sendOrderToWhatsApp() {
            if(cart.length === 0) return;
            const phone = document.getElementById('branchSelect').value;
            const branchText = document.getElementById('branchSelect').options[document.getElementById('branchSelect').selectedIndex].text;
            
            let msg = `مرحباً فوال الأفراح (${branchText.split('(')[0].trim()}) 🌿\nأريد طلب الأطباق التالية:\n\n`;
            let total = 0;
            cart.forEach(i => {
                const sub = i.price * i.qty;
                total += sub;
                msg += `• ${i.name} (${i.qty}x) = ${sub} ر.س\n`;
            });
            msg += `\n💰 الإجمالي: ${total} ر.س`;

            window.open(`https://wa.me/966${phone.substring(1)}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // تشغيل القائمة عند الفتح
        window.onload = renderMenu;
    </script>
</body>
</html>
