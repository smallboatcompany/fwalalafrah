        }

        .logo-img {

        }

            transform: translateY(0);

        }

<body class="bg-[#fafbfa] text-slate-800 pt-20 pb-32">

            <div class="relative mb-3">

    <!-- سلة الطلبات العائمة -->

        let currentCategory = 'all';
        let cart = [];

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = menuData.filter(item => {
                const matchCat = (currentCategory === 'all' || item.cat === currentCategory);
                const matchSearch = item.name.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-2xl border border-slate-100 shadow-xs">
                        <i class="fa-solid fa-utensils text-slate-300 text-3xl mb-2"></i>
                        <p class="text-slate-500 text-xs font-bold">عذراً، لم نجد طبقاً بهذا الاسم</p>
                    </div>`;
                return;
            }

            filtered.forEach(item => {
                const inCart = cart.find(i => i.name === item.name);
                const qtyBadge = inCart ? `<span class="bg-brandGold text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-xs animate-pulse">${inCart.qty} في السلة</span>` : '';

                grid.innerHTML += `
                    <div class="dish-card p-3.5 flex items-center justify-between gap-3 relative overflow-hidden">
                        <div class="flex items-center gap-3 flex-1 min-w-0">
                            <img src="${item.img}" alt="${item.name}" class="w-16 h-16 rounded-xl object-cover shrink-0 border border-slate-100" onerror="this.src='https://via.placeholder.com/150?text=Food'">
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-extrabold text-slate-800 text-xs sm:text-sm truncate">${item.name}</h3>
                                    ${qtyBadge}
                                </div>
                                <p class="text-[10px] text-amber-600 font-bold mt-1 flex items-center gap-1"><i class="fa-solid fa-fire text-[9px]"></i> ${item.cal} سعرة حرارية</p>
                                <span class="text-brandOlive font-black text-xs sm:text-sm block mt-1">${item.price} <span class="text-[10px] font-normal text-slate-500">ر.س</span></span>
                            </div>
                        </div>
                        <button onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.price})" class="btn-press bg-brandOlive hover:bg-brandDarkOlive text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm shrink-0 flex items-center gap-1">
                            <i class="fa-solid fa-plus text-[10px]"></i> إضافة
                        </button>
                    </div>
                `;
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active-tab'));
            btn.classList.add('active-tab');
            renderMenu();
        }

        function addToCart(name, price) {
            const index = cart.findIndex(i => i.name === name);
            if (index > -1) { 
                cart[index].qty += 1; 
            } else { 
                cart.push({ name, price, qty: 1 }); 
            }
            updateCartUI();
            renderMenu();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            document.getElementById('cartCount').innerText = totalItems;
            document.getElementById('cartTotal').innerText = totalPrice;

            const cartBar = document.getElementById('cartBar');
            if (totalItems > 0) { 
                cartBar.classList.add('show'); 
            } else { 
                cartBar.classList.remove('show'); 
                closeCartModal(); 
            }
        }

        function openCartModal() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            cart.forEach((item, idx) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs">
                        <div class="min-w-0 flex-1 pl-2">
                            <p class="font-bold text-slate-800 truncate">${item.name}</p>
                            <p class="text-brandOlive font-black mt-0.5">${item.price * item.qty} ر.س</p>
                        </div>
                        <div class="flex items-center gap-2.5 bg-white px-2.5 py-1.5 rounded-xl border border-slate-200 shrink-0">
                            <button onclick="changeQty(${idx}, -1)" class="text-red-600 font-bold px-1 hover:bg-red-50 rounded"><i class="fa-solid fa-minus text-[10px]"></i></button>
                            <span class="font-black text-slate-800">${item.qty}</span>
                            <button onclick="changeQty(${idx}, 1)" class="text-green-600 font-bold px-1 hover:bg-green-50 rounded"><i class="fa-solid fa-plus text-[10px]"></i></button>
                        </div>
                    </div>
                `;
            });
            const modal = document.getElementById('cartModal');
            modal.classList.remove('pointer-events-none');
            modal.classList.add('open');
        }

        function closeCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.remove('open');
            setTimeout(() => modal.classList.add('pointer-events-none'), 300);
        }

        function changeQty(idx, delta) {
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            updateCartUI();
            renderMenu();
            if (cart.length > 0) openCartModal();
        }

        function sendOrderToWhatsApp() {
            if (cart.length === 0) return;
            const phone = document.getElementById('branchSelect').value;
            let msg = `مرحباً فوال الأفراح 🌿\nأريد طلب الأصناف التالية:\n\n`;
            let total = 0;
            cart.forEach(i => {
                const sub = i.price * i.qty;
                total += sub;
                msg += `• ${i.name} (${i.qty}x) = ${sub} ر.س\n`;
            });
            msg += `\n💰 الإجمالي الكلي: ${total} ر.س\n\nيرجى تأكيد الطلب وتجهيزه للاستلام. شكراً لكم!`;
            window.open(`https://wa.me/966${phone.substring(1)}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.addEventListener('DOMContentLoaded', renderMenu);
    </script>
