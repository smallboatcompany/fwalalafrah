<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فوال الأفراح | المنيو الرقمي والطلبات</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- المكتبات المباشرة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandOlive: '#235d39',
                        brandDarkOlive: '#133821',
                        brandGold: '#c89b3c',
                        brandCream: '#fafbfa',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #fafbfa;
            color: #1e293b;
            line-height: 2 !important;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cairo', sans-serif;
            line-height: 1.4 !important;
        }

        .site-header {
            background-color: rgba(35, 93, 57, 0.98);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .logo-img {
            height: 48px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
            display: block;
        }

        .category-btn.active-tab {
            background-color: #235d39 !important;
            color: #ffffff !important;
            border-color: #235d39 !important;
        }

        .dish-card {
            background: #ffffff;
            border: 1px solid #e5ebe6;
            border-radius: 16px;
            transition: all 0.2s ease;
        }

        .dish-card:hover {
            border-color: #c89b3c;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
        }

        #cartBar {
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.25, 1.1), opacity 0.3s ease;
            transform: translateY(150%);
            opacity: 0;
        }

        #cartBar.show {
            transform: translateY(0);
            opacity: 1;
        }

        #cartModal {
            transition: opacity 0.3s ease;
        }

        #cartModal .modal-sheet {
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.25, 1.1);
            transform: translateY(100%);
        }

        #cartModal.open {
            opacity: 1;
        }

        #cartModal.open .modal-sheet {
            transform: translateY(0);
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        .btn-press { transition: all 0.2s ease; }
        .btn-press:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-[#fafbfa] text-slate-800 pt-20 pb-28">

    <!-- Header -->
    <header id="siteHeader" class="site-header fixed top-0 left-0 right-0 z-50 text-white border-b border-white/10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="logo.png" alt="فوال الأفراح" class="logo-img" onerror="this.onerror=null; this.src='logo-icon.png';">
            </a>

            <a href="index.html" class="btn-press text-xs font-bold bg-white/10 hover:bg-white/20 text-white px-3.5 py-2 rounded-xl border border-white/10">
                <i class="fa-solid fa-house ml-1"></i> الرئيسية
            </a>
        </div>
    </header>

    <!-- الشريط التفاعلي للبحث والأقسام -->
    <section class="bg-white border-b border-slate-200 py-3.5 px-4 sticky top-[58px] z-40 shadow-sm">
        <div class="container mx-auto max-w-5xl">
            <!-- البحث -->
            <div class="relative mb-3">
                <input type="text" id="searchInput" onkeyup="renderMenu()" placeholder="ابحث عن طبقك المفضّل..."
                       class="w-full py-2.5 pr-9 pl-4 rounded-xl text-slate-800 bg-slate-50 border border-slate-200 text-xs md:text-sm font-medium focus:ring-2 focus:ring-brandOlive outline-none">
                <i class="fa-solid fa-magnifying-glass absolute right-3 top-3.5 text-slate-400 text-xs"></i>
            </div>

            <!-- أزرار الفلاتر الجوال -->
            <div class="flex gap-2 overflow-x-auto pb-1 text-xs font-bold scrollbar-none">
                <button onclick="setCategory('all', this)" class="category-btn active-tab px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 whitespace-nowrap">الكل</button>
                <button onclick="setCategory('foul', this)" class="category-btn px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 whitespace-nowrap">فول وعدس</button>
                <button onclick="setCategory('eggs', this)" class="category-btn px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 whitespace-nowrap">بيض وشعبيات</button>
                <button onclick="setCategory('mains', this)" class="category-btn px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 whitespace-nowrap">كبدة ومقلقل</button>
                <button onclick="setCategory('mutabbaq', this)" class="category-btn px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 whitespace-nowrap">مطبّق</button>
                <button onclick="setCategory('masoub', this)" class="category-btn px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 whitespace-nowrap">معصوب وعريكة</button>
                <button onclick="setCategory('bread', this)" class="category-btn px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 whitespace-nowrap">خبز وتميس</button>
                <button onclick="setCategory('drinks', this)" class="category-btn px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 whitespace-nowrap">مشروبات</button>
            </div>
        </div>
    </section>

    <!-- شبكة الأصناف -->
    <main class="container mx-auto px-4 max-w-5xl mt-5">
        <div class="grid sm:grid-cols-2 gap-3" id="menuGrid"></div>
    </main>

    <!-- سلة الطلبات العائمة -->
    <div id="cartBar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-brandOlive text-white rounded-2xl p-3.5 shadow-xl flex justify-between items-center z-50 border border-white/20">
        <div class="flex items-center gap-3">
            <div class="relative bg-white/10 p-2 rounded-xl">
                <i class="fa-solid fa-basket-shopping text-brandGold text-lg"></i>
                <span id="cartCount" class="absolute -top-1.5 -right-1.5 bg-amber-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </div>
            <div>
                <p class="text-[10px] text-emerald-100">إجمالي الطلب:</p>
                <p class="text-sm font-black text-white"><span id="cartTotal">0</span> ر.س</p>
            </div>
        </div>
        <button onclick="openCartModal()" class="btn-press bg-brandGold text-white font-black px-4 py-2 rounded-xl text-xs shadow">
            مراجعة الطلب <i class="fa-solid fa-arrow-left mr-1"></i>
        </button>
    </div>

    <!-- نافذة إرسال الواتساب -->
    <div id="cartModal" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center opacity-0 pointer-events-none p-0 sm:p-4">
        <div class="modal-sheet bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-brandOlive text-white p-4 flex justify-between items-center">
                <h2 class="font-bold text-sm"><i class="fa-solid fa-cart-shopping ml-2 text-brandGold"></i> أطباقك المختارة</h2>
                <button onclick="closeCartModal()" class="text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="p-4 overflow-y-auto flex-1 space-y-2.5" id="cartItemsList"></div>

            <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اختر الفرع القريب منك:</label>
                    <select id="branchSelect" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold text-xs bg-white">
                        <option value="0533508148">فرع الروضة (0533508148)</option>
                        <option value="0550907600">فرع المونسية (0550907600)</option>
                        <option value="0583993468">فرع القادسية (0583993468)</option>
                    </select>
                </div>

                <button onclick="sendOrderToWhatsApp()" class="btn-press w-full bg-green-600 hover:bg-green-700 text-white font-black py-3 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-brands fa-whatsapp text-lg"></i> إرسال الطلب المباشر للواتساب
                </button>
            </div>
        </div>
    </div>

    <!-- البرمجة الكاملة لبطاقات وسلة الطعام -->
    <script>
        const menuData = [
            // الفول والعدس
            { id: 1, name: 'فول جرة سمن وزيت', price: 9, cal: 320, cat: 'foul' },
            { id: 2, name: 'فول قلابة سمن وزيت', price: 9, cal: 340, cat: 'foul' },
            { id: 3, name: 'فول طاوة', price: 11, cal: 490, cat: 'foul' },
            { id: 4, name: 'فول بيض صنعاني', price: 12, cal: 560, cat: 'foul' },
            { id: 9, name: 'عدس طاوة', price: 11, cal: 300, cat: 'foul' },

            // البيض والشعبيات
            { id: 18, name: 'بيض عيون', price: 9, cal: 370, cat: 'eggs' },
            { id: 22, name: 'شكشوكة عادي', price: 10, cal: 380, cat: 'eggs' },
            { id: 23, name: 'شكشوكة عدني', price: 11, cal: 480, cat: 'eggs' },

            // كبدة ومقلقل
            { id: 27, name: 'كبدة غنم طازج', price: 22, cal: 350, cat: 'mains' },
            { id: 29, name: 'كبدة حاشي طازج', price: 22, cal: 310, cat: 'mains' },
            { id: 31, name: 'مقلقل لحم', price: 22, cal: 410, cat: 'mains' },

            // المطبق
            { id: 48, name: 'مطبق الأفراح المميز', price: 9, cal: 320, cat: 'mutabbaq' },
            { id: 57, name: 'مطبق حلو قشطة', price: 8, cal: 750, cat: 'mutabbaq' },

            // معصوب وعريكة
            { id: 66, name: 'معصوب عادي عسل سمن', price: 12, cal: 620, cat: 'masoub' },
            { id: 67, name: 'معصوب قشطة عسل وسمن', price: 17, cal: 850, cat: 'masoub' },
            { id: 85, name: 'عريكة الأفراح الخاصة', price: 20, cal: 750, cat: 'masoub' },

            // الخبز والتميس
            { id: 90, name: 'ملوح صغير', price: 2, cal: 820, cat: 'bread' },
            { id: 95, name: 'تميس سمن', price: 3, cal: 1400, cat: 'bread' },
            { id: 97, name: 'تميس عادي', price: 1, cal: 1400, cat: 'bread' },

            // المشروبات
            { id: 105, name: 'شاي سادة', price: 1, cal: 60, cat: 'drinks' },
            { id: 107, name: 'حليب عدني', price: 3, cal: 90, cat: 'drinks' }
        ];

        let currentCategory = 'all';
        let cart = [];

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = menuData.filter(item => {
                const matchCat = (currentCategory === 'all' || item.cat === currentCategory);
                const matchSearch = item.name.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-xs">لا يوجد طبق بهذا الاسم</div>`;
                return;
            }

            filtered.forEach(item => {
                const inCart = cart.find(i => i.name === item.name);
                const qtyBadge = inCart ? `<span class="bg-brandGold text-white text-[10px] font-black px-2 py-0.5 rounded-full">${inCart.qty}</span>` : '';

                grid.innerHTML += `
                    <div class="dish-card p-3 flex items-center justify-between gap-3">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <h3 class="font-extrabold text-slate-800 text-xs sm:text-sm truncate">${item.name}</h3>
                                ${qtyBadge}
                            </div>
                            <p class="text-[10px] text-amber-600 font-bold mt-1"><i class="fa-solid fa-fire text-[9px]"></i> ${item.cal} سعرة</p>
                            <span class="text-brandOlive font-black text-xs sm:text-sm block mt-1">${item.price} <span class="text-[9px]">ر.س</span></span>
                        </div>
                        <button onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.price})" class="btn-press bg-brandOlive text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm">
                            + إضافة
                        </button>
                    </div>
                `;
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active-tab'));
            btn.classList.add('active-tab');
            renderMenu();
        }

        function addToCart(name, price) {
            const index = cart.findIndex(i => i.name === name);
            if (index > -1) { cart[index].qty += 1; }
            else { cart.push({ name, price, qty: 1 }); }
            updateCartUI();
            renderMenu();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            document.getElementById('cartCount').innerText = totalItems;
            document.getElementById('cartTotal').innerText = totalPrice;

            const cartBar = document.getElementById('cartBar');
            if (totalItems > 0) { cartBar.classList.add('show'); }
            else { cartBar.classList.remove('show'); closeCartModal(); }
        }

        function openCartModal() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            cart.forEach((item, idx) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-100 p-2.5 rounded-xl text-xs">
                        <div>
                            <p class="font-bold text-slate-800">${item.name}</p>
                            <p class="text-brandOlive font-black">${item.price * item.qty} ر.س</p>
                        </div>
                        <div class="flex items-center gap-2 bg-white px-2 py-1 rounded-lg border border-slate-200">
                            <button onclick="changeQty(${idx}, -1)" class="text-red-600 font-bold px-1.5">-</button>
                            <span class="font-bold">${item.qty}</span>
                            <button onclick="changeQty(${idx}, 1)" class="text-green-600 font-bold px-1.5">+</button>
                        </div>
                    </div>
                `;
            });
            const modal = document.getElementById('cartModal');
            modal.classList.remove('pointer-events-none');
            modal.classList.add('open');
        }

        function closeCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.remove('open');
            setTimeout(() => modal.classList.add('pointer-events-none'), 300);
        }

        function changeQty(idx, delta) {
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            updateCartUI();
            renderMenu();
            if (cart.length > 0) openCartModal();
        }

        function sendOrderToWhatsApp() {
            if (cart.length === 0) return;
            const phone = document.getElementById('branchSelect').value;
            let msg = `مرحباً فوال الأفراح 🌿\nأريد طلب الأصناف التالية:\n\n`;
            let total = 0;
            cart.forEach(i => {
                const sub = i.price * i.qty;
                total += sub;
                msg += `• ${i.name} (${i.qty}x) = ${sub} ر.س\n`;
            });
            msg += `\n💰 الإجمالي: ${total} ر.س`;
            window.open(`https://wa.me/966${phone.substring(1)}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.addEventListener('DOMContentLoaded', renderMenu);
    </script>
</body>
</html>
