    <style>
        :root {
            --primary: #1e5233;
            --primary-light: #2a6f46;
            --primary-dark: #10301d;
            --accent: #cfa24d;
            --accent-glow: rgba(207, 162, 77, 0.35);
            --bg-light: #f9fbf9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-shadow: 0 4px 20px rgba(16, 48, 29, 0.05);
            --card-shadow-hover: 0 12px 30px rgba(30, 82, 51, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            padding-top: 75px;
            padding-bottom: 120px;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, .brand-font { font-family: 'Cairo', sans-serif; line-height: 1.25; }
        a { text-decoration: none; color: inherit; }
        .container { width: 100%; max-width: 1050px; margin: 0 auto; padding: 0 1rem; }

        /* شريط التمرير العلوي المضيء */
        #scrollProgress {
            position: fixed; top: 0; left: 0; height: 3.5px; width: 0%;
            background: linear-gradient(90deg, var(--accent), #fef08a, var(--accent));
            z-index: 1002; transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(207, 162, 77, 0.8);
        }

        /* الهيدر */
        .site-header {
            position: fixed; top: 0; left: 0; right: 0; height: 75px;
            background-color: rgba(16, 48, 29, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            border-bottom: 1px solid rgba(207, 162, 77, 0.2);
            display: flex; align-items: center;
        }
        .nav-wrap { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo-img { height: 46px; width: auto; object-fit: contain; }

        .btn-nav-home {
            background-color: rgba(255,255,255,0.08); color: #fff;
            padding: 0.55rem 1.1rem; border-radius: 12px; font-weight: 800;
            font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem;
            border: 1px solid rgba(255,255,255,0.15); transition: background-color 0.2s, transform 0.2s;
        }
        .btn-nav-home:hover { background-color: rgba(255,255,255,0.15); }
        .btn-nav-home:active { transform: scale(0.96); }

        /* شريط التحكم والبحث الذكي الثابت */
        .sticky-control-bar {
            position: sticky; top: 75px; z-index: 990;
            background: rgba(249, 251, 249, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #e2e8f0;
            padding: 0.75rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .search-box-wrap { position: relative; margin-bottom: 0.65rem; }
        .search-input {
            width: 100%; padding: 0.75rem 2.6rem 0.75rem 1rem;
            border-radius: 16px; border: 1.5px solid #e2e8f0;
            background-color: #ffffff; font-family: inherit; font-size: 0.88rem;
            font-weight: 600; color: var(--text-main); outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 82, 51, 0.1);
        }
        .search-icon {
            position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
            color: #94a3b8; font-size: 0.95rem; pointer-events: none;
        }

        .categories-scroll {
            display: flex; gap: 0.5rem; overflow-x: auto;
            padding-bottom: 0.25rem; scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            padding: 0.5rem 1.1rem; border-radius: 50px;
            font-size: 0.82rem; font-weight: 800; font-family: inherit;
            background-color: #ffffff; color: #475569; border: 1px solid #e2e8f0;
            white-space: nowrap; cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cat-btn:active { transform: scale(0.95); }
        .cat-btn.active-cat {
            background-color: var(--primary) !important;
            color: #ffffff !important;
            border-color: var(--primary) !important;
            box-shadow: 0 4px 12px rgba(30, 82, 51, 0.25);
            transform: translateY(-1px);
        }

        /* بطاقات أطباق المنيو */
        .menu-grid {
            display: grid; grid-template-columns: 1fr;
            gap: 0.85rem; margin-top: 1rem;
        }
        @media (min-width: 640px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        }

        .dish-card {
            background: #ffffff; border-radius: 20px;
            border: 1.5px solid #edf2f0; padding: 0.85rem;
            display: flex; align-items: center; justify-content: space-between; gap: 0.85rem;
            box-shadow: var(--card-shadow); position: relative; overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .dish-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: var(--card-shadow-hover);
        }

        .dish-img-wrap {
            position: relative; width: 85px; height: 85px;
            border-radius: 16px; overflow: hidden; flex-shrink: 0;
            background-color: #f1f5f9; border: 1px solid #e2e8f0;
        }
        @media (min-width: 480px) {
            .dish-img-wrap { width: 95px; height: 95px; }
        }
        .dish-img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }

        .dish-info { flex: 1; min-width: 0; }
        .dish-title {
            font-size: 0.95rem; font-weight: 800; color: #0f172a;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.2rem;
        }
        .dish-meta {
            display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem;
            color: #d97706; font-weight: 700; margin-bottom: 0.35rem;
        }
        .dish-price {
            font-size: 1.05rem; font-weight: 900; color: var(--primary);
            font-family: 'Cairo', sans-serif;
        }
        .dish-price span { font-size: 0.75rem; font-weight: 700; color: #64748b; }

        /* أزرار الإضافة والتعديل */
        .dish-actions {
            flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
        }

        .btn-add-initial {
            background-color: var(--primary); color: #fff;
            width: 38px; height: 38px; border-radius: 12px;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; font-weight: 800; box-shadow: 0 4px 10px rgba(30, 82, 51, 0.2);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        .btn-add-initial:active { transform: scale(0.88); }
        .btn-add-initial:hover { background-color: var(--primary-light); }

        .qty-stepper {
            display: none; align-items: center; gap: 0.35rem;
            background-color: #f1f5f9; padding: 0.25rem; border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .qty-stepper.active-stepper { display: inline-flex; }

        .btn-step {
            width: 28px; height: 28px; border-radius: 8px; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 900; transition: all 0.15s ease;
        }
        .btn-step:active { transform: scale(0.85); }
        .btn-step-minus { background-color: #fee2e2; color: #dc2626; }
        .btn-step-plus { background-color: var(--primary); color: #ffffff; }
        .step-count {
            font-weight: 900; font-size: 0.88rem; min-width: 18px; text-align: center; color: #0f172a;
        }

        /* سلة الطلبات العائمة */
        #cartBar {
            position: fixed; bottom: 1.25rem; left: 1rem; right: 1rem;
            max-width: 440px; margin: 0 auto;
            background: linear-gradient(135deg, var(--primary-dark) 0%, #174229 100%);
            color: #fff; border-radius: 50px; padding: 0.65rem 0.9rem 0.65rem 1.25rem;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 15px 35px rgba(16, 48, 29, 0.45), 0 0 0 1.5px rgba(207, 162, 77, 0.4);
            z-index: 995;
            transform: translateY(180%);
            opacity: 0; pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        #cartBar.show { transform: translateY(0); opacity: 1; pointer-events: auto; }

        .cart-bar-info { display: flex; align-items: center; gap: 0.85rem; }
        
        .cart-badge-icon {
            position: relative; width: 44px; height: 44px;
            background: rgba(255,255,255,0.12); border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            color: var(--accent); border: 1.5px solid rgba(207, 162, 77, 0.3);
            flex-shrink: 0;
        }
        .cart-badge-num {
            position: absolute; -top: 6px; -right: 6px;
            background-color: #ef4444; color: #fff; font-size: 0.72rem; font-weight: 900;
            min-width: 22px; height: 22px; padding: 0 4px; border-radius: 50px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            font-family: 'Cairo', sans-serif; line-height: 1;
        }

        .btn-view-cart {
            background: linear-gradient(135deg, var(--accent) 0%, #b88d3b 100%);
            color: #fff; font-weight: 900; font-size: 0.88rem; padding: 0.7rem 1.35rem;
            border-radius: 50px; border: none; cursor: pointer;
            display: inline-flex; align-items: center; gap: 0.45rem;
            box-shadow: 0 4px 15px rgba(207, 162, 77, 0.4);
            transition: transform 0.15s ease;
            flex-shrink: 0;
        }
        .btn-view-cart:active { transform: scale(0.94); }

            background-color: rgba(14, 43, 26, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

        @media (min-width: 640px) {
            #cartModal { align-items: center; padding: 1.5rem; }

        #cartModal.open { opacity: 1; pointer-events: auto; }

        .modal-sheet {
            background: #fff; width: 100%; max-width: 460px;
            border-radius: 28px 28px 0 0; max-height: 88vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (min-width: 640px) {
            .modal-sheet { border-radius: 24px; transform: scale(0.95) translateY(20px); }
        }
        #cartModal.open .modal-sheet { transform: translateY(0) scale(1); }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: #fff; padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(207, 162, 77, 0.3);

        .btn-close-modal {
            background: rgba(255,255,255,0.15); border: none; color: white;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
        }

        .modal-items-list {
            padding: 1.25rem 1.5rem; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 0.75rem;
        }
        .cart-item-row {
            background-color: #f8fafc; border: 1px solid #e2e8f0;
            padding: 0.75rem 1rem; border-radius: 16px; display: flex;
            justify-content: space-between; align-items: center; gap: 0.75rem;
        }

        .modal-footer {
            background-color: #f8fafc; border-top: 1px solid #e2e8f0; padding: 1.25rem 1.5rem;
        }

        .branch-select-title {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 0.85rem; font-weight: 800; color: #1e293b; margin-bottom: 0.6rem;
        }
        .branches-radio-grid {
            display: grid; grid-template-columns: 1fr; gap: 0.5rem; margin-bottom: 1.25rem;
        }

        .branch-choice-card {
            border: 2px solid #e2e8f0; background: #ffffff; padding: 0.75rem 1rem;
            border-radius: 16px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.2s ease;
        }
        .branch-choice-card:hover { border-color: #cbd5e1; background-color: #f8fafc; }
        .branch-choice-card.selected-branch {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.15);
        }

        .branch-choice-info { display: flex; align-items: center; gap: 0.65rem; }
        .branch-choice-icon {
            width: 34px; height: 34px; border-radius: 10px;
            background-color: #e2e8f0; color: #475569; display: flex;
            align-items: center; justify-content: center; font-size: 0.9rem;
            transition: all 0.2s;
        }
        .selected-branch .branch-choice-icon { background-color: #22c55e; color: #ffffff; }

        .branch-choice-check {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid #cbd5e1; display: flex; align-items: center;
            justify-content: center; font-size: 0.7rem; color: transparent;
            transition: all 0.2s;
        }
        .selected-branch .branch-choice-check {
            border-color: #22c55e; background-color: #22c55e; color: #ffffff;
        }

        .btn-send-whatsapp {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: #fff; font-weight: 900; font-size: 0.95rem; padding: 0.95rem;
            border-radius: 16px; border: none; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            box-shadow: 0 8px 25px rgba(22, 163, 74, 0.35);
            transition: transform 0.2s ease;
        }
        .btn-send-whatsapp:active { transform: scale(0.97); }

        .empty-results {
            text-align: center; padding: 3.5rem 1rem; background: #fff;
            border-radius: 24px; border: 1px solid #e2e8f0;
        }
        .empty-results i { font-size: 2.5rem; color: #cbd5e1; margin-bottom: 0.5rem; }
    </style>

            const filtered = menuData.filter(item => {

                return matchCat && matchSearch;

                grid.innerHTML = `
                    <div class="empty-results" style="grid-column: 1 / -1;">

                                    id="addBtn-${item.id}"
                                    style="${qty > 0 ? 'display:none;' : 'display:flex;'}"
                                    aria-label="إضافة للطلب">
                                <i class="fa-solid fa-plus"></i>
                            </button>

                            <div class="qty-stepper ${qty > 0 ? 'active-stepper' : ''}" id="stepper-${item.id}">
                                <button onclick="modifyCart(${item.id}, -1)" class="btn-step btn-step-minus" aria-label="إنقاص">
                                    <i class="fa-solid fa-minus"></i>
                                </button>
                                <span class="step-count" id="count-${item.id}">${qty}</span>
                                <button onclick="modifyCart(${item.id}, 1)" class="btn-step btn-step-plus" aria-label="زيادة">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active-cat'));
            btn.classList.add('active-cat');
            renderMenu();
        }

        function modifyCart(itemId, delta) {
            const itemData = menuData.find(i => i.id === itemId);
            if (!itemData) return;

            const index = cart.findIndex(i => i.id === itemId);
            let currentQty = 0;

            if (index > -1) {
                cart[index].qty += delta;
                currentQty = cart[index].qty;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                    currentQty = 0;
                }
            } else if (delta > 0) {
                cart.push({ id: itemData.id, name: itemData.name, price: itemData.price, qty: 1 });
                currentQty = 1;
            }

            const addBtn = document.getElementById(`addBtn-${itemId}`);
            const stepper = document.getElementById(`stepper-${itemId}`);
            const countEl = document.getElementById(`count-${itemId}`);

            if (addBtn && stepper && countEl) {
                if (currentQty > 0) {
                    addBtn.style.display = 'none';
                    stepper.classList.add('active-stepper');
                    countEl.innerText = currentQty;
                } else {
                    addBtn.style.display = 'flex';
                    stepper.classList.remove('active-stepper');
                    countEl.innerText = '0';
                }
            }

            updateCartUI();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            const countEl = document.getElementById('cartCount');
            const totalEl = document.getElementById('cartTotal');
            const cartBar = document.getElementById('cartBar');

            countEl.innerText = totalItems;
            totalEl.innerText = totalPrice;

            if (totalItems > 0) {
                cartBar.classList.add('show');
            } else {
                cartBar.classList.remove('show');
                closeCartModal();
            }

            const modal = document.getElementById('cartModal');
            if (modal.classList.contains('open')) {
                if (cart.length > 0) {
                    buildCartModalItems();
                } else {
                    closeCartModal();
                }
            }
        }

        function buildCartModalItems() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            cart.forEach((item) => {
                list.innerHTML += `
                    <div class="cart-item-row">
                        <div style="flex:1; min-width:0;">
                            <p style="font-weight:800; font-size:0.9rem; color:#0f172a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</p>
                            <p style="font-weight:900; color:var(--primary); font-size:0.85rem; font-family:'Cairo'; margin-top:0.15rem;">${item.price * item.qty} ر.س</p>
                        </div>
                        <div style="display:flex; align-items:center; gap:0.4rem; background:#fff; padding:0.25rem 0.5rem; border-radius:10px; border:1px solid #cbd5e1;">
                            <button onclick="modifyCart(${item.id}, -1)" style="background:none; border:none; color:#dc2626; font-weight:bold; cursor:pointer; padding:2px 5px;"><i class="fa-solid fa-minus" style="font-size:0.75rem;"></i></button>
                            <span style="font-weight:900; font-size:0.85rem; color:#0f172a;">${item.qty}</span>
                            <button onclick="modifyCart(${item.id}, 1)" style="background:none; border:none; color:var(--primary); font-weight:bold; cursor:pointer; padding:2px 5px;"><i class="fa-solid fa-plus" style="font-size:0.75rem;"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function openCartModal() {
            buildCartModalItems();
            const modal = document.getElementById('cartModal');
            modal.classList.add('open');
        }

        function closeCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.remove('open');
        }

        document.getElementById('cartModal').addEventListener('click', (e) => {
            if (e.target.id === 'cartModal') closeCartModal();
        });

        function selectBranch(phone, cardEl) {
            document.querySelectorAll('.branch-choice-card').forEach(c => c.classList.remove('selected-branch'));
            cardEl.classList.add('selected-branch');
            document.getElementById('selectedBranchPhone').value = phone;
        }

        function sendOrderToWhatsApp() {
            if (cart.length === 0) return;
            const phone = document.getElementById('selectedBranchPhone').value;
            let msg = `مرحباً فوال الأفراح 🌿\nأريد طلب الأصناف التالية:\n\n`;
            let total = 0;
            cart.forEach(i => {
                const sub = i.price * i.qty;
                total += sub;
                msg += `• ${i.name} (عدد: ${i.qty}) = ${sub} ر.س\n`;
            });
            msg += `\n💰 الإجمالي الكلي: ${total} ر.س\n\nيرجى تأكيد وتجهيز الطلب للاستلام. شكراً لكم!`;
            window.open(`https://wa.me/966${phone.substring(1)}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('scrollProgress').style.width = scrolled + '%';
        }, { passive: true });

        window.addEventListener('DOMContentLoaded', renderMenu);
    </script>
</body>
</html>
